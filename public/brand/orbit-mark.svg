<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Orbit">
  <!-- Classy Orbit mark: student + orbit rings + spark -->
  <defs>
    <linearGradient id="orbitRing" x1="20" y1="100" x2="100" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E4FD6"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
  </defs>
  <!-- Outer soft plate for app tiles -->
  <circle cx="60" cy="60" r="56" fill="currentColor" opacity="0" />
  <!-- Top/left navy arc -->
  <path d="M28 78c-6-14-4-32 10-44 12-10 28-13 42-8" stroke="#0B1F44" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Bottom royal orbit swoosh -->
  <path d="M22 86c18 16 42 20 66 8 10-5 18-13 22-22" stroke="url(#orbitRing)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M30 94c16 10 38 12 58 2" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- Planet -->
  <circle cx="92" cy="34" r="5.5" fill="#0B1F44"/>
  <!-- Student silhouette (simplified, elegant) -->
  <g fill="#0B1F44">
    <ellipse cx="58" cy="42" rx="9" ry="10"/>
    <path d="M44 88c2-18 8-28 14-32 4-2 10-2 14 1 6 4 12 14 14 31-8 4-18 6-28 5-5 0-10-2-14-5z"/>
    <path d="M46 62c-4 2-8 8-9 16 4 2 8 3 12 3 1-7 2-13 4-17-3-1-5-1-7-2z"/>
  </g>
  <!-- Tablet highlight -->
  <rect x="54" y="62" width="16" height="11" rx="1.5" fill="#E8EEF9" stroke="#0B1F44" stroke-width="1.2"/>
  <path d="M57 65.5h10M57 68.5h7" stroke="#3B82F6" stroke-width="1" stroke-linecap="round"/>
  <!-- Sparkles -->
  <path d="M78 48l1.2 2.8 2.8 1.2-2.8 1.2L78 56l-1.2-2.8L74 52l2.8-1.2L78 48z" fill="#3B82F6"/>
  <path d="M86 54l.8 1.8 1.8.8-1.8.8L86 59.2l-.8-1.8L83.4 56l1.8-.8L86 54z" fill="#0B1F44"/>
  <path d="M82 42l.6 1.4 1.4.6-1.4.6L82 46l-.6-1.4L80 44l1.4-.6L82 42z" fill="#5B8CFF"/>
</svg>
